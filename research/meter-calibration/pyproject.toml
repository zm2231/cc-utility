[project]
name = "meter-calibration"
version = "0.1.0"
description = "Estimate how Claude subscription usage meters weight each token type, from cc-utility sidecar logs and Claude Code transcripts"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
meter-calibration = "meter_calibration.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
